name: publish

# Push a tag `v<version>` (e.g. v1.0.1) to publish all six packages.
# Auth is npm trusted publishing (OIDC): no token secret. Each package must
# list this repository and this workflow file as a trusted publisher in its
# settings on npmjs.com, which is only possible once the package exists, so
# the very first release is published by hand with `npm run release`.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write # trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24 # ships npm 11, which trusted publishing needs
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Check tag matches package versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for p in packages/*; do
            ver="$(node -p "require('./$p/package.json').version")"
            test "$tag" = "$ver" || { echo "tag $tag != $p version $ver"; exit 1; }
          done
      - run: npm publish --workspaces --access public
